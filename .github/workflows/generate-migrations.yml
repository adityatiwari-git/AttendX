name: Generate Django migrations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Django model discovery
        run: |
          python manage.py shell -c "from django.apps import apps; [print(f'{config.label}: {[model.__name__ for model in config.get_models()]}') for config in apps.get_app_configs() if config.label in {'accounts', 'academics', 'attendance'}]"
          python manage.py check

      - name: Generate initial migrations
        run: |
          python manage.py makemigrations accounts academics attendance --verbosity 3
          test -f accounts/migrations/0001_initial.py
          test -f academics/migrations/0001_initial.py
          test -f attendance/migrations/0001_initial.py

      - name: Commit migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A accounts/migrations academics/migrations attendance/migrations
          git diff --cached --quiet && { echo "Migration files were not created."; exit 1; }
          git commit -m "Add initial Django database migrations"
          git push origin HEAD:main
