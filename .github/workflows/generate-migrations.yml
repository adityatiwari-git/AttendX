name: Generate Django migrations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate model migrations
        run: python manage.py makemigrations

      - name: Commit migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts/migrations academics/migrations attendance/migrations
          if git diff --cached --quiet; then
            echo "No new migration files were generated."
            exit 0
          fi
          git commit -m "Add initial Django database migrations"
          git push origin HEAD:main
