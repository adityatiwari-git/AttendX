name: Generate Django migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'attendx/settings.py'
      - 'attendance/models.py'
      - 'accounts/models.py'
      - 'academics/models.py'
      - '.github/workflows/generate-migrations.yml'
      - 'accounts/tests.py'
      - 'attendance/tests.py'
      - 'core/tests.py'
      - 'accounts/migrations/**'
      - 'accounts/management/commands/**'

permissions:
  contents: write

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check Django project
        run: python manage.py check
      - name: Run automated tests
        run: python manage.py test accounts attendance --verbosity 2
      - name: Generate migrations
        run: python manage.py makemigrations accounts academics attendance --verbosity 3
      - name: Commit migrations when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A accounts/migrations academics/migrations attendance/migrations
          if git diff --cached --quiet; then
            echo "No new migrations."
          else
            git commit -m "Add attendance concern migration"
            git push origin HEAD:main
          fi
